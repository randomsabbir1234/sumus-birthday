
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Pretty SUMU 🌸</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030208;
}

.intro {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 70%,
      #251329 0%,
      #100a19 35%,
      #030208 78%);
}

/* Background light */
.glow {
  position: absolute;
  width: 230px;
  height: 180px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: #f05aaa;
  filter: blur(80px);
  opacity: .22;
  animation: glowPulse 3s ease-in-out infinite alternate;
  z-index: 1;
  pointer-events: none;
}

/* Flowers layer */
.flowers {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* Individual flowers */
.flower {
  position: absolute;
  bottom: 0;
  width: var(--w);
  height: var(--h);
  transform-origin: bottom center;
  transform: scaleY(0);
  animation: grow 1.7s cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay: var(--delay);
}

.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 2px;
  height: 78%;
  transform: translateX(-50%);
  background: linear-gradient(to top, #17391d, #68a94c);
  border-radius: 50%;
}

.leaf {
  position: absolute;
  width: 14px;
  height: 7px;
  background: #478348;
  border-radius: 100% 0 100% 0;
}

.leaf.left {
  left: 50%;
  bottom: 28%;
  transform: rotate(20deg);
}

.leaf.right {
  right: 50%;
  bottom: 43%;
  transform: rotate(200deg);
}

/* Flower heads */
.bloom {
  position: absolute;
  top: 0;
  left: 50%;
  width: 32px;
  height: 32px;
  transform: translateX(-50%);
  animation: sway 3s ease-in-out infinite alternate;
}

.petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 18px;
  margin-left: -6px;
  margin-top: -15px;
  border-radius: 50% 50% 40% 40%;
  background: var(--color);
  transform-origin: 50% 15px;
  transform: rotate(var(--angle));
  box-shadow: 0 0 9px var(--color);
}

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 9px;
  height: 9px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #ffe59a;
  box-shadow: 0 0 12px #ffce69;
}

/* Ground */
.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 13%;
  background: linear-gradient(transparent, #09140b);
  z-index: 4;
  pointer-events: none;
}

/* Center text */
.message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 96%;
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(23px, 6.5vw, 42px);
  font-weight: bold;
  font-style: italic;
  line-height: 1.8;
  letter-spacing: .5px;
  z-index: 10;
  pointer-events: none;
}

.message span {
  display: inline-block;
  opacity: 0;
  background: linear-gradient(
    180deg,
    #fff0ac,
    #ff83c4 48%,
    #c4a0ff
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(255,105,180,.4));
  animation: letterRise .7s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--delay);
}

/* Animations */
@keyframes grow {
  from { transform: scaleY(0); }
  to { transform: scaleY(1); }
}

@keyframes sway {
  from { rotate: -5deg; }
  to { rotate: 5deg; }
}

@keyframes letterRise {
  0% {
    opacity: 0;
    transform: translateY(60px);
  }
  70% {
    opacity: 1;
    transform: translateY(-5px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes glowPulse {
  from {
    opacity: .15;
    transform: translate(-50%, -50%) scale(.9);
  }
  to {
    opacity: .32;
    transform: translate(-50%, -50%) scale(1.15);
  }
}

@media (max-width: 400px) {
  .message {
    font-size: 24px;
    letter-spacing: 0;
  }
}
</style>
</head>

<body>
<div class="intro">

  <div class="glow"></div>

  <div class="flowers" id="flowers"></div>

  <div class="ground"></div>

  <div class="message" id="message"></div>

</div>

<script>
const garden = document.getElementById("flowers");
const message = document.getElementById("message");

const colors = [
  "#ff8eb7",
  "#ffca62",
  "#f5a5e8",
  "#fff0a8",
  "#e98ba1",
  "#a9a2ff",
  "#ffb7d5"
];

let maxDelay = 0;

/* Create 48 flowers */
for (let i = 0; i < 48; i++) {
  const flower = document.createElement("div");
  flower.className = "flower";

  const x = (i / 47) * 100;
  const height = 75 + Math.random() * 180;
  const width = 20 + Math.random() * 20;
  const delay = 0.2 + Math.random() * 2.3;
  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  maxDelay = Math.max(maxDelay, delay);

  flower.style.left = `calc(${x}% - ${width / 2}px)`;
  flower.style.setProperty("--h", height + "px");
  flower.style.setProperty("--w", width + "px");
  flower.style.setProperty("--delay", delay + "s");

  const stem = document.createElement("div");
  stem.className = "stem";
  flower.appendChild(stem);

  const leaf1 = document.createElement("div");
  leaf1.className = "leaf left";
  flower.appendChild(leaf1);

  const leaf2 = document.createElement("div");
  leaf2.className = "leaf right";
  flower.appendChild(leaf2);

  const bloom = document.createElement("div");
  bloom.className = "bloom";

  for (let p = 0; p < 8; p++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.setProperty("--angle", (p * 45) + "deg");
    petal.style.setProperty("--color", color);
    bloom.appendChild(petal);
  }

  const center = document.createElement("div");
  center.className = "center";
  bloom.appendChild(center);

  flower.appendChild(bloom);
  garden.appendChild(flower);
}

/* Show each character after all flowers finish growing */
const title = Array.from("Hey pretty SUMU 🎀");

title.forEach((char, index) => {
  const span = document.createElement("span");

  span.textContent = char === " " ? "\u00A0" : char;

  const delay = maxDelay + 1.7 + 0.7 + index * 0.14;

  span.style.setProperty("--delay", delay + "s");

  message.appendChild(span);
});
</script>
</body>
</html>
