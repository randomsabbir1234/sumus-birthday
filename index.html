
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey pretty SUMU 🌸</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020305;
  font-family: Georgia  z-index: 2;
}

/* Flower garden */
.flowers {
  position: absolute;
  bottom: 6%;
  left: 0;
  width: 100%;
  height: 80%;
  z-index: 3;
}

.flower {
  position: absolute;
  bottom: 0;
  width: var(--w);
  height: var(--h);
  transform-origin: bottom center;
  transform: scaleY(0);
  animation: grow 1.7s cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay: var(--delay);
}

.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 2px;
  height: 78%;
  transform: translateX(-50%);
  background: linear-gradient(
    to top,
    #142a16,
    #43843b
  );
  border-radius: 100%;
}

.leaf {
  position: absolute;
  width: 15px;
  height: 7px;
  background: #39733b;
  border-radius: 100% 0 100% 0;
}

.leaf.left {
  left: 50%;
  bottom: 28%;
  transform: rotate(20deg);
}

.leaf.right {
  right: 50%;
  bottom: 43%;
  transform: rotate(200deg);
}

.bloom {
  position: absolute;
  top: 0;
  left: 50%;
  width: 32px;
  height: 32px;
  transform: translate(-50%, -12%);
  animation: sway 3s ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

.petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 11px;
  height: 17px;
  margin-left: -5.5px;
  margin-top: -15px;
  border-radius: 50% 50% 40% 40%;
  background: var(--color);
  transform-origin: 50% 15px;
  transform: rotate(var(--angle));
  box-shadow: 0 0 7px var(--color);
}

.center {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 9px;
  height: 9px;
  background: #f9d875;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px #ffce69;
}

/* Center message */
.message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 94%;
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(24px, 6.5vw, 43px);
  font-weight: bold;
  font-style: italic;
  line-height: 1.5;
  letter-spacing: 1px;
  color: #ff69b4;
  background: linear-gradient(
    90deg,
    #ff80bf,
    #d6a5ff,
    #ffe69a,
    #ff80bf
  );
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 1;
  z-index: 10;
  animation: shine 4s linear infinite;
  filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.45));
}

/* Animations */
@keyframes grow {
  to {
    transform: scaleY(1);
  }
}

@keyframes sway {
  from {
    rotate: -5deg;
  }
  to {
    rotate: 5deg;
  }
}

@keyframes shine {
  from {
    background-position: 0% center;
  }
  to {
    background-position: 300% center;
  }
}

@keyframes glowPulse {
  from {
    opacity: 0.15;
    transform: translate(-50%, -50%) scale(0.9);
  }
  to {
    opacity: 0.35;
    transform: translate(-50%, -50%) scale(1.15);
  }
}

@media (max-width: 400px) {
  .message {
    font-size: 25px;
    letter-spacing: 0;
  }
}
</style>
</head>

<body>
<div class="intro">

  <div class="glow"></div>

  <div class="flowers" id="flowers"></div>

  <div class="ground"></div>

  <div class="message">Hey pretty SUMU 🎀</div>

</div>
