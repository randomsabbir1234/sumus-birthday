<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9dce8">
<title>For Sumu ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=Pacifico&display=swap');
:root{--ink:#583c50;--wash:#ffe2ee;--accent:#d65b91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100svh;color:var(--ink);font-family:Poppins,system-ui,sans-serif;background:linear-gradient(145deg,#ffe2ee,#fff8fb,#eee7ff);overflow-x:hidden;transition:background 1s ease}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-45px;opacity:.65;will-change:transform;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(15px,110svh,0) rotate(340deg)}}
.app{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px 12px calc(22px + env(safe-area-inset-bottom))}
.card{width:min(100%,560px);padding:clamp(23px,6vw,42px);border:1px solid #ffffffd9;border-radius:28px;background:rgba(255,251,253,.91);box-shadow:0 20px 60px #85476520,inset 0 1px 0 white;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden;animation:cardIn .75s cubic-bezier(.2,.75,.2,1) both}
.card:before{content:"";position:absolute;left:-15%;top:-95px;width:130%;height:155px;border-radius:50%;background:var(--wash);opacity:.72;animation:cloudDrift 8s ease-in-out infinite alternate;pointer-events:none}
@keyframes cloudDrift{to{transform:translate3d(12px,17px,0)}}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,-22px,0) scale(.98)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.page-tag{position:relative;text-align:center;font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#ac7893;margin-bottom:22px}
h1,h2,p,.question,.choices,.cake-wrap,.message,.personal{position:relative}
h1{font:600 clamp(2rem,8vw,3rem)/1.2 'Playfair Display',Georgia,serif;text-align:center;margin:12px 0 20px;animation:rise .9s both}
h1.script{font-family:Pacifico,cursive;font-weight:400;font-size:clamp(1.8rem,7vw,2.65rem)}
h2{font:500 clamp(1.25rem,4.8vw,1.65rem)/1.4 'Playfair Display',Georgia,serif;text-align:center;margin:18px 0}
p{line-height:1.8;text-align:center;margin:14px 0}
.question{text-align:center;font-size:1.04rem;line-height:1.7;font-weight:500;margin:25px 0 18px;animation:questionIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes questionIn{0%{opacity:0;transform:translate3d(0,12px,0) scale(.96)}75%{transform:translate3d(0,-2px,0) scale(1.01)}100%{opacity:1;transform:none}}
.choices{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin:22px auto 12px}
button{font:500 .94rem Poppins,system-ui,sans-serif;border:1px solid #edbad0;background:linear-gradient(145deg,#fff,#fff0f6);color:#87415f;padding:12px 21px;min-height:46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 16px #b84d7d17;transition:transform .22s ease,box-shadow .22s ease,background .22s ease;touch-action:manipulation}
button:focus-visible{outline:3px solid #d65b91;outline-offset:3px}
button:active{transform:scale(.94);box-shadow:0 0 0 7px #f8bdd580}
button.primary{background:linear-gradient(135deg,#e978a8,#d65b91);color:#fff;border-color:#e978a8}
.foot{font-size:.78rem;opacity:.7;text-align:center;margin-top:25px}
.flower-garden{height:105px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(3px,2vw,13px);margin-top:22px;overflow:hidden}
.flower{font-size:clamp(25px,7vw,36px);display:inline-block;transform-origin:bottom center;animation:sway 2.7s ease-in-out infinite alternate}
.flower:nth-child(even){animation-delay:-1.2s}.flower:nth-child(3n){animation-delay:-.5s}
@keyframes sway{from{transform:rotate(-8deg) translateY(3px)}to{transform:rotate(8deg) translateY(-5px)}}
.eye-video{height:175px;border-radius:22px;background:radial-gradient(circle at 50% 35%,#fff8fc,#e7c3dc 58%,#b98eae);display:flex;align-items:center;justify-content:center;gap:clamp(9px,3vw,22px);margin:24px 0;position:relative;overflow:hidden;border:1px solid #e8c7dc}
.eye{width:clamp(55px,16vw,78px);height:45px;background:#fff;border:3px solid #8e657f;border-radius:50% 50% 46% 46%;position:relative;overflow:hidden;animation:blink 4.8s infinite}
.eye:before{content:"";position:absolute;width:30px;height:35px;background:#7b4b69;border-radius:50%;left:22px;top:5px;animation:look 5s ease-in-out infinite}
.eye:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;left:29px;top:10px}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes look{0%,100%{translate:0 0}25%{translate:7px 0}70%{translate:-7px 0}}
.eye-caption{position:absolute;bottom:10px;font-size:10px;letter-spacing:2px;color:#744a69}
.cake-wrap{display:flex;justify-content:center;margin:14px auto 5px;min-height:170px}
.cake{position:relative;width:230px;height:160px;max-width:100%}
.cake-top{position:absolute;bottom:80px;left:15px;width:200px;height:48px;border-radius:50%;background:#8d4a63;border:5px solid #f7b6cb;z-index:2}
.cake-body{position:absolute;bottom:0;left:15px;width:200px;height:100px;background:linear-gradient(90deg,#85415a,#b7657e,#85415a);border-radius:10px 10px 20px 20px;box-shadow:inset 0 -12px #6f344d}
.icing{position:absolute;z-index:3;bottom:72px;left:15px;width:200px;height:30px;background:#ffe0ec;border-radius:50%;border-bottom:5px solid #f4a2bf}
.cake-number{position:absolute;z-index:4;bottom:22px;left:0;width:100%;text-align:center;font:700 42px 'Playfair Display',Georgia,serif;color:#ffe5ef;text-shadow:0 2px #5d2a42}
.candles{position:absolute;z-index:5;bottom:121px;left:43px;right:43px;display:flex;justify-content:space-between}
.candle{height:48px;width:9px;border-radius:4px;background:repeating-linear-gradient(135deg,#fff 0 5px,#ef85ad 5px 10px);position:relative}
.flame{position:absolute;width:13px;height:20px;left:-2px;top:-20px;background:radial-gradient(ellipse at 50% 70%,#fff9b0 0 20%,#ffb74d 45%,#ff7b67 70%,transparent 72%);border-radius:50%;animation:flicker .34s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes flicker{to{transform:rotate(7deg) scale(.9)}}.candle.out .flame{display:none}
.smoke{position:absolute;left:-3px;top:-25px;font-size:17px;animation:smoke 1s ease-out forwards}@keyframes smoke{to{transform:translateY(-25px);opacity:0}}
.mic-note{font-size:.82rem;color:#98677f;margin:7px 0;text-align:center}
.message{font:.82rem/1.9 'DM Mono',monospace;text-align:left;white-space:pre-wrap;min-height:130px;border-left:2px solid #e8a4c2;padding:8px 0 8px 13px;overflow-wrap:anywhere}
.cursor:after{content:"▋";color:#d85d91;animation:cursorBlink .8s steps(2) infinite}@keyframes cursorBlink{50%{opacity:0}}
textarea{position:relative;width:100%;min-height:175px;resize:vertical;border:1px solid #edbfd2;border-radius:17px;background:#fffafd;padding:14px;color:#654256;font:1rem/1.6 Poppins,system-ui,sans-serif;outline:none}
textarea:focus{border-color:#d85d91;box-shadow:0 0 0 4px #f7c7dc70}
.sparkle{position:fixed;z-index:9;pointer-events:none;animation:spark .85s ease-out forwards;font-size:18px}@keyframes spark{to{transform:translate3d(var(--x),var(--y),0) scale(.2) rotate(180deg);opacity:0}}
@media(max-width:380px){.card{padding:22px 16px;border-radius:23px}.eye-video{height:155px}.cake{transform:scale(.9);transform-origin:top center;margin-bottom:-15px}.message{font-size:.76rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main class="app"><section class="card" id="card" aria-live="polite"></section></main>
<script>
'use strict';
const card=document.getElementById('card');
const themes={1:['#ffe0ec','#d85d91'],2:['#e8e0ff','#9275c9'],3:['#ffe3d7','#b65b67'],4:['#dff4ed','#529b88'],5:['#fce6d6','#c47d51'],6:['#f9dce8','#c75b8c'],7:['#e0eaff','#6b88c7'],8:['#e5def9','#8a6bb8'],9:['#f8e0ec','#b95383'],10:['#ffe8cf','#c17d39'],11:['#f9d8dc','#c34e69'],12:['#e2f3ed','#4f9d87'],13:['#e5e2ff','#8072c5'],14:['#fce4ef','#c15d8b'],15:['#ffe7e9','#c75c76'],16:['#e3eaff','#6883c3']};
function setTheme(n){const t=themes[n]||themes[1];document.documentElement.style.setProperty('--wash',t[0]);document.documentElement.style.setProperty('--accent',t[1]);document.body.style.background=`linear-gradient(145deg,${t[0]},#fff9fc,#eee7ff)`;document.querySelector('meta[name="theme-color"]').content=t[0]}
function el(tag,cls='',txt=''){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=='')e.textContent=txt;return e}
function spark(x,y){for(let i=0;i<5;i++){const s=el('span','sparkle',['💗','✨','🎈','💕','🌸'][i]);s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',(Math.random()*100-50)+'px');s.style.setProperty('--y',(Math.random()*-100-20)+'px');document.body.append(s);setTimeout(()=>s.remove(),900)}}
function btn(txt,fn,primary=false){const b=el('button',primary?'primary':'',txt);b.type='button';b.addEventListener('click',e=>{spark(e.clientX||innerWidth/2,e.clientY||innerHeight/2);fn()});return b}
function choices(items){const d=el('div','choices');items.forEach(i=>d.append(btn(i[0],i[1],!!i[2])));return d}
function render(n,build){setTheme(n);card.innerHTML='';card.style.animation='none';void card.offsetWidth;card.style.animation='cardIn .75s cubic-bezier(.2,.75,.2,1) both';card.append(el('div','page-tag',`A little surprise · ${n}/16`));build(card);window.scrollTo({top:0,behavior:'smooth'})}
function heading(txt,script=false){return el('h1',script?'script':'',txt)}
function flowers(){const d=el('div','flower-garden');['🌷','🌸','🌼','🌹','🌷','🌺'].forEach(x=>d.append(el('span','flower',x)));return d}
function page1(){render(1,c=>{c.append(heading('Hey prettiest Girl, SUMU',true),el('h2','','Are You Crazy???'),choices([['Yes',page2,true],['Yes',page2]]),flowers(),el('div','foot','',''));})}
function page2(){render(2,c=>{c.append(heading('WOW!!!!'),el('h2','','How beautiful girl with pretty eyes 👀🎀'));const v=el('div','eye-video');v.append(el('div','eye'),el('div','eye'),el('div','eye-caption','A LITTLE EYE INTRO ✨'));c.append(v,el('p','question','Are you ready for nxt page ??'),choices([['Yes',page3,true],['Yes',page3]]))})}
let audioStream=null,audioContext=null,blown=false;
function page3(){blown=false;render(3,c=>{c.append(heading('Happiest birthday to SUMU',true),el('p','','Make a wish, birthday girl ♡'));const wrap=el('div','cake-wrap'),cake=el('div','cake');cake.append(el('div','cake-top'),el('div','cake-body'),el('div','icing'),el('div','cake-number','19'));const candles=el('div','candles');for(let i=0;i<5;i++){const ca=el('div','candle');ca.append(el('span','flame'));candles.append(ca)}cake.append(candles);wrap.append(cake);c.append(wrap,el('p','mic-note','🎤 Blow gently into your phone microphone to put out the candles!'));const status=el('p','mic-note','Tap “Enable microphone”, then blow. You can also tap candles to put them out.');c.append(status);candles.querySelectorAll('.candle').forEach(ca=>ca.addEventListener('click',()=>blowOne()));c.append(choices([['Enable microphone 🎤',async()=>{try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('not available');audioStream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new(window.AudioContext||window.webkitAudioContext)();const src=audioContext.createMediaStreamSource(audioStream),an=audioContext.createAnalyser();src.connect(an);an.fftSize=512;const data=new Uint8Array(an.fftSize);status.textContent='Microphone is on — blow gently!';const listen=()=>{if(blown||!card.isConnected)return;an.getByteTimeDomainData(data);let sum=0;for(const x of data)sum+=(x-128)**2;if(Math.sqrt(sum/data.length)>20){blowOne()}if(!blown)requestAnimationFrame(listen)};listen()}catch(e){status.textContent='Mic needs a secure website (HTTPS) and permission. Tap each candle instead.'}},false],['Nxt page →',()=>{stopMic();page4()},true]]))})}
function blowOne(){const all=[...card.querySelectorAll('.candle')];const left=all.find(x=>!x.classList.contains('out'));if(!left)return;left.classList.add('out');left.append(el('span','smoke','☁'));if(all.every(x=>x.classList.contains('out'))){blown=true;const s=card.querySelector('.mic-note');if(s)s.textContent='Wish made! Happy birthday, Sumu! ✨';stopMic()}}
function stopMic(){if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null}if(audioContext){audioContext.close().catch(()=>{});audioContext=null}}
function page4(){render(4,c=>{c.append(heading('Nxt page e onk gula dhamaka ache…'),el('p','','Kintu kotha hochhe, tumi shudhu ekbar-e question gulor answer dite parba. Ekbar answer dile ota ar repeat hobe na 🔁 So be careful…'),el('p','question','Do you think that Sabbir still likes you?'),choices([['Yes',page10],['No',page5,true]]))})}
function page5(){render(5,c=>{c.append(heading('OKEYYYYYY....',true),el('p','question','What kind of friend is Sabbir to you?'),choices([['Just friend',page6],['Best friend',page7,true],['Just known',page8]]))})}
function addLittleMessage(c){c.append(heading('OKEYYYYY, Good Girl'),el('p','','I have a little msg for you…'),el('p','question','Do you want to read it?'),choices([['Yes',page9,true],['Yes',page9]]))}
function page6(){render(6,addLittleMessage)}
function page7(){render(7,c=>{c.append(heading('Are you serious??? 😱',true),el('h2','','OKEYYYYY, Good Girl'),el('p','','I have a little msg for you…'),el('p','question','Do you want to read it?'),choices([['Yes',page9,true],['Yes',page9]]))})}
function page8(){render(8,c=>{c.append(heading('Whattt !!!!'),el('h2','','Do you think that I’m just known to you?'),el('p','','I have a little msg for you…'),el('p','question','Do you want to read it?'),choices([['Yes',page9,true],['Yes',page9]]))})}
const message=`Tumi janle obak hobe je ami first time karo birthday-te etto koshto kore ekta wish banacchi, so maybe it’s a little special 🐒

Jaihok, bolte chaile toh onek kichui bola jay. Onek kotha bolar iccha ache, but onno konodin… 🙂

You know? You are such a wonderful singer 😭❤️ I can’t explain it in words. Asholei tomar voice ta onek shundor, trust me or not 🤌😚

Ar shobcheye funny hochhe je majhe moddhe reels-e random kono meyer gaan dekhleo tomar kotha mone pore jay 😭🥹 Emanki tomar kotha bhebei oder reels-e like diye dei 💀🤦‍♂️

Anyway, happy birthday once again ❤️ Always keep singing, ar emnei shundor theko, shobshomoy hashikhushi theko, gaan geyo… Majhe moddhe mon chaile amakeo dui-ekta dio 😭🙏 Tomar jonno mon theke onek onek shubhokamona roilo 🫶🏻`;
function askSomething(c){c.append(el('p','question','Do you want to say something to Sabbir?'),choices([['Yes',page14,true],['No',page15]]))}
function page9(){render(9,c=>{c.append(heading('A little message for you ♡',true));const m=el('div','message cursor');c.append(m);let i=0;function type(){if(!card.contains(m))return;if(i<message.length){m.textContent+=message[i++];setTimeout(type,12)}else{m.classList.remove('cursor');askSomething(c)}}type()})}
function page10(){render(10,c=>{c.append(heading('Reallyyyy !!',true),el('p','question','Do you really think that I still like you?'));c.append(choices([['Yes',()=>{if(c.querySelector('.confess'))return;const box=el('div','confess');box.style.animation='rise .7s both';box.append(el('p','question','Should I confess to you?'),choices([['Yes',page11,true],['No',page11]]));c.append(box)},true],['No',page12]]))})}
function page11(){render(11,c=>{c.append(heading('Reallyyy!!!',true),el('h2','','Okeyy pretty girl 🤗'),el('p','','Get ready…'),el('p','question','Will you be MINE!!!!?'),choices([['Yes',page16,true],['No',page13]]))})}
function page12(){render(12,addLittleMessage)}
function page13(){render(13,c=>{c.append(heading('Last msg',true),el('p','question','Do you want to say something to Sabbir?'),choices([['Yes',page14,true],['No',page15]]))})}
function page14(){render(14,c=>{c.append(heading('Put down it here',true),el('p','','Write anything you want to say 💌'));const ta=el('textarea');ta.placeholder='Write your message here…';ta.setAttribute('aria-label','Your personal message');c.append(ta,choices([['Done ♡',()=>{try{sessionStorage.setItem('sumuMessage',ta.value)}catch(e){}page15()},true]]))})}
function page15(){render(15,c=>{c.append(heading('Okey good girl',true),el('h2','','Take care of you. Again, happy birthday to you ❤️'),el('p','question','Do you want to block Sabbir?'),choices([['Yes',blockedPage,true],['Yes',blockedPage]]))})}
function blockedPage(){render(15,c=>{c.append(heading('Awww 😭💗',true),el('p','','Whatever you choose, I hope your day is full of love, music and happiness. ♡'),flowers())})}
function page16(){render(16,c=>{c.append(heading('I don’t expect it!',true),el('h2','','I will talk to you later.'),el('p','','But one msg to you…'),el('p','question','Do you want to read it?'),choices([['Yes',page9,true],['Yes',page9]]))})}
const petalLayer=document.getElementById('petals');for(let i=0;i<16;i++){const p=el('span','petal',['🌸','♡','✿','🌷'][i%4]);p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(10+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*18)+'s';p.style.fontSize=(12+Math.random()*10)+'px';petalLayer.append(p)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMic()});
page1();
</script></body></html>
