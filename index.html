
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👀🙈</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #100b09;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.video {
  position: relative;
  width: 100%;
  max-width: 900px;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #241711;
  color: white;
}

.photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  position: absolute;
  inset: 0;
  animation: zoom 7s ease-in-out infinite alternate;
}

.shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.55),
    transparent 45%,
    rgba(0,0,0,.12)
  );
}

.caption {
  position: absolute;
  top: 8%;
  left: 5%;
  width: 90%;
  text-align: center;
  color: #fff0df;
  font-family: "Trebuchet MS", cursive;
  font-size: clamp(17px, 3.5vw, 34px);
  font-weight: 500;
  line-height: 1.5;
  text-shadow: 0 2px 8px #3b2118;
  opacity: 0;
  transform: translateY(15px);
  animation: appear 1.4s ease forwards;
}

.hearts {
  display: block;
  margin-top: 5px;
  font-size: .8em;
  letter-spacing: 10px;
}

.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  background: linear-gradient(transparent, rgba(0,0,0,.4));
}

button {
  color: white;
  background: transparent;
  border: 0;
  font-size: 22px;
  cursor: pointer;
}

.track {
  flex: 1;
  height: 4px;
  border-radius: 10px;
  background: #ffffff66;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: white;
}

.time {
  font-size: 13px;
  white-space: nowrap;
}

@keyframes appear {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(1.12); }
}

.video.paused .photo {
  animation-play-state: paused;
}

.video.paused .caption {
  animation-play-state: paused;
}

@media (max-width: 500px) {
  .video {
    aspect-ratio: 4 / 3;
  }

  .caption {
    top: 7%;
    font-size: 19px;
  }

  .controls {
    padding: 8px;
    gap: 7px;
  }
}
</style>
</head>

<body>

<div class="video" id="video">

  <!-- নিজের ছবির নাম image.jpg রাখবি -->
  <img src="IMG_20261022_173957.jpg" class="photo" alt="Beautiful eyes">
  <div class="shade"></div>

  <div class="caption">
    Emne thakaiyo na manush<br>
    heart attack korbe 👀🙈
    <span class="hearts">♡ ─ ♡ ─ ♡</span>
  </div>

  <div class="controls">
    <button id="toggle" aria-label="Pause animation">Ⅱ</button>

    <div class="track">
      <div class="progress" id="progress"></div>
    </div>

    <span class="time" id="time">0:00 / 0:07</span>
  </div>

</div>

<script>
const video = document.getElementById("video");
const toggle = document.getElementById("toggle");
const progress = document.getElementById("progress");
const time = document.getElementById("time");

const duration = 7;
let start = performance.now();
let elapsed = 0;
let paused = false;
let frame;

function update(now) {
  if (paused) return;

  elapsed = ((now - start) / 1000) % duration;

  progress.style.width = (elapsed / duration * 100) + "%";

  const seconds = Math.floor(elapsed);
  time.textContent =
    `0:${String(seconds).padStart(2, "0")} / 0:07`;

  frame = requestAnimationFrame(update);
}

frame = requestAnimationFrame(update);

toggle.addEventListener("click", () => {
  paused = !paused;
  video.classList.toggle("paused", paused);

  if (paused) {
    cancelAnimationFrame(frame);
    toggle.textContent = "▶";
  } else {
    start = performance.now() - elapsed * 1000;
    toggle.textContent = "Ⅱ";
    frame = requestAnimationFrame(update);
  }
});
</script>

</body>
</html>
